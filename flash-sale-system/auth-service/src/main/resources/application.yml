server:
  port: 8101

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3307/flash_sale_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1
  redis:
    host: localhost
    port: 6379
  jackson:
    parser:
      allow-unquoted-field-names: true
      allow-single-quotes: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.flashsale.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
