 server:
   port: 8105
 spring:
   application:
     name: order-service
   datasource:
     url: jdbc:mysql://localhost:3307/flash_sale_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
     username: root
     password: root
     driver-class-name: com.mysql.cj.jdbc.Driver
   redis:
     host: localhost
     port: 6379
   cloud:
     nacos:
       discovery:
         server-addr: localhost:8848
         ip: 127.0.0.1
 mybatis-plus:
   mapper-locations: classpath:mapper/*.xml
   type-aliases-package: com.flashsale.order.entity
   configuration:
     map-underscore-to-camel-case: true
     log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
